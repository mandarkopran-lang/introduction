<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Introduction to Kopran | कोप्रानची ओळख</title>
<style>
  :root {
    --navy: #0A2540;
    --blue: #0066CC;
    --teal: #00A896;
    --bg-gradient: linear-gradient(135deg, #0A2540 0%, #1E3A8A 50%, #00A896 100%);
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Segoe UI', Inter, Roboto, 'Mukta', 'Noto Sans Devanagari', sans-serif;
    height: 100vh;
    width: 100vw;
    display: flex;
    justify-content: center;
    align-items: center;
    background: var(--bg-gradient);
    color: #ffffff;
    overflow: hidden;
  }

  .container {
    text-align: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 50px 40px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.15);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
    max-width: 600px;
    width: 90%;
  }

  .title-en {
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 700;
    margin-bottom: 8px;
    letter-spacing: -0.5px;
  }

  .title-mr {
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 600;
    color: #8DE0DC;
    margin-bottom: 35px;
  }

  .subtitle {
    font-size: 16px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: #CBD5E1;
    margin-bottom: 25px;
  }

  .btn-group {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .lang-btn {
    display: inline-block;
    text-decoration: none;
    padding: 16px 36px;
    font-size: 18px;
    font-weight: 700;
    border-radius: 50px;
    transition: all 0.3s ease;
    min-width: 160px;
  }

  .btn-english {
    background: #ffffff;
    color: var(--navy);
  }

  .btn-english:hover {
    background: #E2E8F0;
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(255, 255, 255, 0.2);
  }

  .btn-marathi {
    background: var(--teal);
    color: #ffffff;
  }

  .btn-marathi:hover {
    background: #008678;
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0, 168, 150, 0.4);
  }
</style>
</head>
<body>

  <div class="container">
    <div class="title-en">Introduction to Kopran</div>
    <div class="title-mr">कोप्रनची ओळख</div>
    
    <div class="subtitle">Select Your Language / भाषा निवडा</div>

    <div class="btn-group">
      <a href="indexe.html" class="lang-btn btn-english">English</a>
      <a href="indexm.html" class="lang-btn btn-marathi">मराठी</a>
    </div>
  </div>

</body>
</html>
